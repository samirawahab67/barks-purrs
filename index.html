<title>Barks &amp; Purrs Co. Store</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.json"><meta name="apple-mobile-web-app-title" content="Barks & Purrs Store"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#163028">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
<style>
/* Barks & Purrs Co. — store, option B "Maison".
   Colour: ONLY the six brand colours (tints are the same colours at reduced opacity).
   Type: ONLY the brand faces — SF Pro (system on Apple devices) and Savoye LET (installed on macOS/iOS).
   The font files are not embedded (licensing); Pinyon Script / system-ui are emergency fallbacks only.
   Light and dark themes follow the system, with a manual toggle in the header. */
@font-face { font-family: "BP Script"; src: local("Savoye LET"), local("SavoyeLetPlain"), local("Savoye LET Plain"), local("Savoye LET Plain:1.0"); font-display: swap; }
:root {
  --cream: #FCEFD5; --ivory: #F5EFE2; --emerald: #163028; --ink: #17130F; --gold: #C3984C; --silver: #9AA1A3;
  --bg: var(--cream); --surface: var(--ivory); --text: var(--ink);
  --muted: rgba(23,19,15,.64); --faint: rgba(23,19,15,.42); --line: rgba(23,19,15,.12); --line-2: rgba(23,19,15,.28);
  --accent: var(--emerald); --on-accent: var(--cream); --btn: var(--ink); --on-btn: var(--cream);
  --band: var(--emerald); --on-band: var(--cream); --band-muted: rgba(252,239,213,.7); --band-line: rgba(252,239,213,.16);
  --script-c: var(--emerald); --stage: var(--ivory); --glass: rgba(252,239,213,.92);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", system-ui, sans-serif;
  --script: "BP Script", "Savoye LET", "Pinyon Script", cursive;
  --g: max(20px, env(safe-area-inset-left, 0px)); --gr: max(20px, env(safe-area-inset-right, 0px));
  --max: 1520px; --ease: cubic-bezier(.2,.7,.2,1); --r: 4px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: var(--ink); --surface: var(--emerald); --text: var(--cream);
  --muted: rgba(252,239,213,.66); --faint: rgba(252,239,213,.42); --line: rgba(252,239,213,.13); --line-2: rgba(252,239,213,.3);
  --accent: var(--gold); --on-accent: var(--ink); --btn: var(--cream); --on-btn: var(--ink);
  --band: var(--emerald); --script-c: var(--gold); --stage: var(--emerald); --glass: rgba(23,19,15,.88);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: var(--ink); --surface: var(--emerald); --text: var(--cream);
  --muted: rgba(252,239,213,.66); --faint: rgba(252,239,213,.42); --line: rgba(252,239,213,.13); --line-2: rgba(252,239,213,.3);
  --accent: var(--gold); --on-accent: var(--ink); --btn: var(--cream); --on-btn: var(--ink);
  --band: var(--emerald); --script-c: var(--gold); --stage: var(--emerald); --glass: rgba(23,19,15,.88);
  color-scheme: dark; }
@media (min-width: 900px) { :root { --g: 48px; --gr: 48px; } }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background .4s, color .4s; }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
img, video { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; font-weight: 400; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mark { display: inline-block; background: currentColor; -webkit-mask: url(icon.png) center / contain no-repeat; mask: url(icon.png) center / contain no-repeat; aspect-ratio: 494 / 470; flex: none; }
.wordmark { display: inline-block; background: currentColor; -webkit-mask: url(wordmark.png) center / contain no-repeat; mask: url(wordmark.png) center / contain no-repeat; aspect-ratio: 1634 / 176; }
.script { font-family: var(--script); font-weight: 400; line-height: 1; letter-spacing: 0; }
.serif { font-style: italic; font-weight: 300; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: var(--g); padding-right: var(--gr); }
.sample { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sample::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.display { font-weight: 300; letter-spacing: -.035em; line-height: .95; }

/* buttons & links */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 30px; border-radius: 999px; background: var(--btn); color: var(--on-btn); font-weight: 500; font-size: 14px; letter-spacing: .01em; border: 1px solid var(--btn); transition: transform .15s var(--ease), opacity .2s; white-space: nowrap; }
.btn:hover { opacity: .88; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--text); opacity: 1; }
.btn.cream { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.btn.line-cream { background: transparent; color: var(--cream); border-color: rgba(252,239,213,.4); }
.btn.sm { min-height: 40px; padding: 0 18px; font-size: 13px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }
.tlink, .link { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; text-decoration-color: var(--line-2); transition: text-decoration-color .2s; }
.tlink:hover, .link:hover { text-decoration-color: currentColor; }
.tlink { font-weight: 500; font-size: 14px; }
.arrowlink { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; }
.arrowlink svg { width: 18px; transition: transform .3s var(--ease); }
.arrowlink:hover svg { transform: translateX(4px); }
.ibtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; position: relative; color: var(--text); transition: background .2s; }
.ibtn:hover { background: var(--line); }
.ibtn svg { width: 20px; height: 20px; }
.count { position: absolute; top: 5px; right: 4px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 600; display: grid; place-items: center; }

/* header */
.announce { background: var(--band); color: var(--on-band); font-size: 12px; text-align: center; padding: 9px var(--gr) 9px var(--g); letter-spacing: .02em; }
.announce span { opacity: .9; }
.hdr { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); transition: background .4s; }
.hdr .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 64px; gap: 8px; }
.hdr .logo { display: flex; align-items: center; color: var(--text); justify-self: center; }
.hdr .logo .wordmark { width: 150px; }
.hdr nav.main { display: none; }
.hdr .left, .hdr .right { display: flex; align-items: center; gap: 0; }
.hdr .right { justify-self: end; }
.hdr .acct { display: none; }
@media (max-width: 599px) { .hdr #wishbtn { display: none; } .hdr .logo .wordmark { width: 136px; } }
@media (min-width: 1100px) {
  .hdr .wrap { grid-template-columns: auto 1fr auto; height: 76px; gap: 40px; }
  .hdr .logo { justify-self: start; }
  .hdr .logo .wordmark { width: 196px; }
  .hdr .left { display: none; }
  .hdr nav.main { display: flex; justify-content: center; gap: 2px; }
  .hdr nav.main a { padding: 8px 14px; font-size: 14px; border-radius: 999px; transition: background .2s; white-space: nowrap; }
  .hdr nav.main a small { color: var(--faint); font-size: 12px; margin-left: 2px; }
  .hdr nav.main a:hover { background: var(--line); }
  .hdr nav.main a[aria-current="page"] { background: var(--text); color: var(--bg); }
  .hdr nav.main a[aria-current="page"] small { color: inherit; opacity: .6; }
  .hdr .acct { display: grid; }
}
.themebtn .sun { display: none; }
:root[data-theme="dark"] .themebtn .sun { display: inline; } :root[data-theme="dark"] .themebtn .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .themebtn .sun { display: inline; } :root:not([data-theme="light"]) .themebtn .moon { display: none; } }

/* overlays */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(23,19,15,.5); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; z-index: 61; top: 0; bottom: 0; width: min(440px, 100vw); background: var(--bg); display: flex; flex-direction: column; transition: transform .45s var(--ease), visibility 0s .45s; visibility: hidden; }
.drawer.left { left: 0; transform: translateX(-102%); }
.drawer.right { right: 0; transform: translateX(102%); }
.drawer.on { transform: none; visibility: visible; transition: transform .45s var(--ease); }
.drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 14px var(--gr) 14px var(--g); border-bottom: 1px solid var(--line); min-height: 64px; }
.drawer .dh h2 { font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.drawer .db { flex: 1; overflow-y: auto; padding: 18px var(--gr) 18px var(--g); }
.drawer .df { padding: 16px var(--gr) calc(16px + env(safe-area-inset-bottom, 0px)) var(--g); border-top: 1px solid var(--line); display: grid; gap: 10px; background: var(--surface); }
.mnav { display: grid; }
.mnav a, .mnav button { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 24px; font-weight: 300; letter-spacing: -.02em; }
.mnav small { color: var(--faint); font-size: 13px; letter-spacing: 0; }
.searchpanel { position: fixed; z-index: 61; left: 0; right: 0; top: 0; background: var(--bg); transform: translateY(-104%); transition: transform .45s var(--ease), visibility 0s .45s; visibility: hidden; max-height: 92vh; overflow-y: auto; border-bottom: 1px solid var(--line); }
.searchpanel.on { transform: none; visibility: visible; transition: transform .45s var(--ease); }
.searchpanel .sbar { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--text); padding: 18px 0 12px; }
.searchpanel .sbar svg { width: 22px; }
.searchpanel input { flex: 1; border: 0; background: transparent; font-size: clamp(22px, 3vw, 34px); font-weight: 300; outline: none; min-width: 0; letter-spacing: -.02em; }
.modal { position: fixed; z-index: 62; left: 50%; top: 50%; width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; background: var(--bg); border-radius: 16px; transform: translate(-50%, -46%); opacity: 0; pointer-events: none; transition: transform .4s var(--ease), opacity .3s; }
.modal.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
@media (max-width: 760px) { .modal { left: 0; right: 0; top: auto; bottom: 0; width: 100%; max-height: 90vh; border-radius: 16px 16px 0 0; transform: translateY(100%); } .modal.on { transform: none; } }
.toast { position: fixed; z-index: 80; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; transition: .3s var(--ease); background: var(--text); color: var(--bg); padding: 13px 20px; border-radius: 999px; font-size: 14px; display: flex; gap: 14px; align-items: center; max-width: calc(100vw - 32px); pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* loader — ink & emerald only */
.loader { position: fixed; inset: 0; z-index: 100; background: var(--ink); display: grid; place-items: center; overflow: hidden; color: var(--cream); transition: opacity .8s ease, visibility .8s; }
.loader.out { opacity: 0; visibility: hidden; }
.loader .vel { position: absolute; inset: -10%; background: var(--emerald) url(img/velvet-1.webp) center / cover; opacity: .9; animation: drift 9s ease-in-out infinite alternate; }
.loader .vel.b { display: none; }
.loader video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
.loader video.on { opacity: .45; }
.loader .lg { position: relative; z-index: 2; display: grid; justify-items: center; gap: 20px; padding: 0 24px; }
.loader .lg .wordmark { width: min(520px, 80vw); color: var(--cream); clip-path: inset(0 100% 0 0); animation: wipe 1.5s cubic-bezier(.65,0,.25,1) .35s forwards; }
.loader .lg .tag { font-size: clamp(28px, 4vw, 40px); color: var(--cream); opacity: 0; animation: fadeup 1s var(--ease) 1.6s forwards; }
.loader .lg .line { width: 120px; height: 1px; background: rgba(252,239,213,.2); overflow: hidden; opacity: 0; animation: fadeup .6s ease 1.8s forwards; }
.loader .lg .line i { display: block; height: 100%; width: 0; background: var(--gold); animation: grow 1.5s ease 1.9s forwards; }
.loader .skip { position: absolute; z-index: 3; right: var(--gr); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--cream); opacity: .75; padding: 10px; }
@keyframes drift { from { transform: translate3d(-3%, -2%, 0) scale(1.04); } to { transform: translate3d(3%, 2%, 0) scale(1.1); } }
@keyframes wipe { to { clip-path: inset(0 0 0 0); } }
@keyframes grow { to { width: 100%; } }
@keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* sections */
main { min-height: 60vh; }
.sec { padding-top: 88px; padding-bottom: 88px; }
@media (min-width: 900px) { .sec { padding-top: 128px; padding-bottom: 128px; } }
.sh { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 36px; flex-wrap: wrap; }
.sh h2 { font-size: clamp(34px, 4vw, 56px); font-weight: 300; letter-spacing: -.035em; line-height: 1; }
.fade { opacity: 0; transform: translateY(16px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.fade.in { opacity: 1; transform: none; }

/* ===== HOME — option B ===== */
.mx-hero { display: grid; border-bottom: 1px solid var(--line); }
.mx-hero .media { position: relative; min-height: 62svh; overflow: hidden; background: var(--emerald); }
.mx-hero .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mx-hero .copy { display: grid; align-content: space-between; gap: 40px; padding: 40px var(--gr) 0 var(--g); }
.mx-hero h1 { font-size: clamp(56px, 7.6vw, 136px); }
.mx-hero h1 .s { display: block; font-family: var(--script); font-weight: 400; letter-spacing: 0; color: var(--script-c); font-size: 1.12em; line-height: .9; margin-top: .06em; }
.mx-hero .lede { font-size: clamp(17px, 1.4vw, 20px); color: var(--muted); max-width: 30ch; margin-top: 22px; }
.mx-hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.mx-hero .split { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); margin: 0 calc(var(--gr) * -1) 0 calc(var(--g) * -1); }
.mx-hero .split a { padding: 18px var(--gr) 18px var(--g); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 500; }
.mx-hero .split a + a { border-left: 1px solid var(--line); padding-left: 20px; }
.mx-hero .split a span { color: var(--faint); font-weight: 400; font-size: 13px; display: block; }
.mx-hero .split svg { width: 18px; flex: none; }
@media (min-width: 1000px) {
  .mx-hero { grid-template-columns: 1.05fr 1fr; min-height: calc(100vh - 110px); }
  .mx-hero .copy { order: -1; padding: 72px 56px 0 var(--g); border-right: 1px solid var(--line); }
  .mx-hero .split { margin: 0 -56px 0 calc(var(--g) * -1); }
  .mx-hero .split a { padding: 26px 28px 26px var(--g); }
  .mx-hero .split a + a { padding-left: 28px; padding-right: 56px; }
  .mx-hero .media { min-height: 0; }
}
.mx-strip { display: grid; grid-template-columns: repeat(2, 1fr); border-bottom: 1px solid var(--line); }
.mx-strip div { padding: 22px 20px; display: grid; gap: 2px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.mx-strip div:nth-child(2n) { border-right: 0; }
.mx-strip div:nth-child(n+3) { border-bottom: 0; }
.mx-strip b { font-weight: 500; }
.mx-strip span { font-size: 13px; color: var(--muted); }
@media (min-width: 900px) { .mx-strip { grid-template-columns: repeat(4, 1fr); } .mx-strip div { border-bottom: 0; padding: 28px; } .mx-strip div:nth-child(2n) { border-right: 1px solid var(--line); } .mx-strip div:last-child { border-right: 0; } .mx-strip div:first-child { padding-left: var(--g); } }
.mx-nature { display: grid; }
@media (min-width: 800px) { .mx-nature { grid-template-columns: 1fr 1fr; } }
.mx-n { position: relative; display: block; aspect-ratio: 4/5; overflow: hidden; background: var(--surface); }
@media (min-width: 800px) { .mx-n { aspect-ratio: auto; height: min(88vh, 900px); } }
.mx-n img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s var(--ease); }
.mx-n:hover img { transform: scale(1.03); }
.mx-n .lbl { position: absolute; left: 16px; bottom: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 20px; background: var(--glass); border-radius: var(--r); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text); }
@media (min-width: 800px) { .mx-n .lbl { left: 28px; right: 28px; bottom: 28px; padding: 22px 26px; } }
.mx-n .lbl b { display: block; font-size: clamp(26px, 2.6vw, 38px); font-weight: 300; letter-spacing: -.03em; line-height: 1.05; }
.mx-n .lbl span { font-size: 13px; color: var(--muted); }
.mx-n .lbl i { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-style: normal; }
.mx-n .lbl i svg { width: 18px; }
.mx-n .finish { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; }
.mx-n .finish::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
.mx-rail-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 32px; }
.mx-rail-h h2 { font-size: clamp(34px, 4vw, 56px); margin-top: 10px; }
.railnav { display: none; gap: 8px; }
@media (min-width: 900px) { .railnav { display: flex; } }
.railnav button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; }
.railnav button:hover { border-color: var(--text); }
.railnav svg { width: 18px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 72%; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; scroll-behavior: smooth; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
@media (min-width: 700px) { .rail { grid-auto-columns: calc(33.333% - 11px); } }
@media (min-width: 1200px) { .rail { grid-auto-columns: calc(25% - 12px); } }
.mx-band { background: var(--band); color: var(--on-band); }
.mx-band .in2 { display: grid; gap: 40px; padding-top: 80px; padding-bottom: 80px; }
@media (min-width: 1000px) { .mx-band .in2 { grid-template-columns: 1.1fr 1fr; gap: 80px; padding-top: 120px; padding-bottom: 120px; align-items: center; } }
.mx-band .eyebrow { color: var(--band-muted); }
.mx-band h2 { font-size: clamp(40px, 5vw, 76px); margin-top: 14px; }
.mx-band h2 .s { font-family: var(--script); color: var(--gold); letter-spacing: 0; font-weight: 400; font-size: 1.1em; }
.mx-band p { color: var(--band-muted); max-width: 42ch; margin-top: 18px; }
.mx-band .stage { border-radius: var(--r); overflow: hidden; border: 1px solid var(--band-line); }
.mx-band .stage svg { display: block; width: 100%; height: auto; }
.mx-steps { display: grid; margin: 34px 0 30px; border-top: 1px solid var(--band-line); }
.mx-steps div { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--band-line); }
.mx-steps .n { font-size: 28px; font-weight: 200; letter-spacing: -.03em; color: var(--gold); line-height: 1; }
.mx-steps b { font-weight: 500; display: block; }

.try { display: grid; gap: 14px; margin-bottom: 28px; }

/* product cards */

/* listing */

.toolbar { position: sticky; top: 64px; z-index: 5; background: var(--bg); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 28px; }

.chipline { display: flex; gap: 8px; flex-wrap: wrap; margin: -12px 0 22px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; background: transparent; white-space: nowrap; transition: .2s; }

.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.lay { display: grid; gap: 32px; }
.lay > * { min-width: 0; }

@media (min-width: 1100px) { .lay { grid-template-columns: 240px 1fr; gap: 44px; } .lay .side { display: block; position: sticky; top: 150px; align-self: start; max-height: calc(100vh - 170px); overflow-y: auto; } .fbtn { display: none !important; } }

.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: 14px; }

.empty { display: grid; justify-items: center; text-align: center; gap: 14px; padding: 60px 20px; border: 1px dashed var(--line-2); border-radius: var(--r); }

/* product page */
.pdp { display: grid; gap: 32px; padding-bottom: 40px; }

@media (min-width: 1000px) { .pdp { grid-template-columns: 1.3fr 1fr; gap: 64px; } .pdp .info { position: sticky; top: 100px; align-self: start; } }
.gal { display: grid; gap: 10px; min-width: 0; }

.swatch { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line-2); position: relative; }

.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 999px; height: 52px; }

.qty span { min-width: 24px; text-align: center; }
.qty.sm { height: 38px; } .qty.sm button { width: 34px; }

.acc { border-top: 1px solid var(--line); }
.acc details { border-bottom: 1px solid var(--line); }

.input { width: 100%; min-height: 52px; padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--bg); color: var(--text); }
.input:focus { outline: none; border-color: var(--text); }

.err { font-size: 13px; color: var(--text); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.err::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; }
.hint { font-size: 13px; color: var(--faint); }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

@media (min-width: 600px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 62%; gap: 14px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; padding-bottom: 6px; }

@media (min-width: 800px) { .hscroll { grid-auto-columns: calc(25% - 11px); } }

/* configurator */
.cfg { display: grid; gap: 28px; padding-bottom: 60px; }

@media (min-width: 1000px) { .cfg { grid-template-columns: 1.2fr 1fr; gap: 56px; } .cfg .pv { position: sticky; top: 100px; align-self: start; } }
.cfg .stage { border-radius: var(--r); overflow: hidden; background: var(--stage); position: relative; border: 1px solid var(--line); }

.cfg .stage.shine .sweep { animation: sweep .9s var(--ease); }
@keyframes sweep { 0% { opacity: 0; transform: translateX(-100%); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(100%); } }
.cfg .stage .bgsw { position: absolute; right: 14px; top: 14px; display: flex; gap: 6px; }

.opts2 { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.o { text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--bg); display: grid; gap: 4px; min-width: 0; transition: border-color .2s, box-shadow .2s; }

.co { display: grid; gap: 32px; padding-bottom: 60px; }

@media (min-width: 1000px) { .co { grid-template-columns: 1.3fr 1fr; gap: 64px; } .co .sum { position: sticky; top: 100px; align-self: start; } }

.radio { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r); border: 1px solid var(--line-2); cursor: pointer; }

/* footer */

@media (min-width: 900px) { footer .top { grid-template-columns: 1.3fr 2fr; } }

@media (min-width: 700px) { footer .cols { grid-template-columns: repeat(4, 1fr); } }
footer h4 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--band-muted); margin-bottom: 14px; }
footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: 14px; }
footer ul a, footer ul span { color: var(--band-muted) !important; }

footer .script { font-family: var(--ui) !important; font-weight: 300; font-size: 30px !important; letter-spacing: -.02em; line-height: 1.15; }
footer .nl input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid var(--band-line); color: var(--on-band); padding: 12px 0; font-size: 16px; }

.page { max-width: 760px; padding-bottom: 40px; display: grid; gap: 18px; }
.page h1 { font-size: clamp(44px, 6vw, 84px); font-weight: 300; letter-spacing: -.04em; line-height: 1; }
.page h2 { font-size: 18px; font-weight: 500; margin-top: 12px; }
.page p { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } .fade { opacity: 1; transform: none; } .loader .lg .wordmark { clip-path: none; } .loader .lg .tag, .loader .lg .line { opacity: 1; } }

/* ================= MOTION & DETAIL LAYER ================= */
:root { --hh: 64px; } @media (min-width: 1100px) { :root { --hh: 76px; } }
.pin { position: sticky; top: var(--hh); height: calc(100vh - var(--hh)); height: calc(100svh - var(--hh)); overflow: hidden; }
/* cinematic hero: full-bleed film that settles into a frame as you scroll */
.cine { position: relative; height: 190vh; background: var(--bg); }
.cine .frame { position: absolute; inset: 0; overflow: hidden; background: var(--emerald); will-change: clip-path; }
.cine .frame video { width: 100%; height: 100%; object-fit: cover; transform: scale(1.12); will-change: transform; }
.cine .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,19,15,.25) 0%, rgba(23,19,15,0) 35%, rgba(23,19,15,.6) 100%); }
.cine-t { position: absolute; left: var(--g); right: var(--gr); bottom: 9vh; color: var(--cream); display: grid; gap: 18px; justify-items: start; max-width: 760px; will-change: transform, opacity; }
.cine-t .eyebrow { color: rgba(252,239,213,.8); }
.cine-t h1 { font-size: clamp(56px, 8vw, 132px); }
.cine-t h1 .s { display: block; font-family: var(--script); font-weight: 400; letter-spacing: 0; color: var(--gold); font-size: 1.1em; line-height: .9; margin-top: .05em; }
.cine-t p { font-size: clamp(16px, 1.4vw, 19px); color: rgba(252,239,213,.85); max-width: 34ch; }
.cine-t .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.cue { position: absolute; right: var(--gr); bottom: 9vh; color: var(--cream); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; writing-mode: vertical-rl; display: flex; gap: 12px; align-items: center; }
.cue::after { content: ""; width: 1px; height: 56px; background: linear-gradient(var(--cream), transparent); animation: cue 2s ease-in-out infinite; }
